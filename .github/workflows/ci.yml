name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minharifa
          POSTGRES_PASSWORD: minharifa
          POSTGRES_DB: minharifa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Gerar Prisma Client e rodar migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://minharifa:minharifa@localhost:5432/minharifa
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy

      - name: Testes unitários com cobertura (mínimo 80%)
        run: pnpm test:cov

      - name: Análise estática (SonarCloud)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e-tests:
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Subir API e Web, então rodar Cucumber + Cypress
        run: |
          pnpm --filter @minharifa/api start:dev &
          pnpm --filter @minharifa/web dev &
          npx wait-on http://localhost:3000 http://localhost:3001
          pnpm test:e2e
